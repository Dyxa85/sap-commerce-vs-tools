name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste passwords, tokens, customer data or the content of your `local.properties`.
        Security problems: see SECURITY.md instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: 'Command palette → "SAP Commerce: About"'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: VS Code version, OS, SAP Commerce version
      placeholder: 'VS Code 1.101, macOS 15, SAP Commerce 2211-jdk21'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A tiny ImpEx/FlexibleSearch/XML snippet that shows the problem helps most.
  - type: textarea
    id: log
    attributes:
      label: Output
      description: 'Command palette → "SAP Commerce: Show Log". Secrets are masked, but check before you paste.'
      render: text
